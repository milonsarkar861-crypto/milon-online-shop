<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milon Online Shop — Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#102018;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}header{background:#0b3d2e;color:#fff;padding:14px;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:14px}.box{background:#fff;border-radius:18px;padding:16px;margin:14px 0;border:1px solid #dfe8e2;box-shadow:0 4px 18px #0b3d2e0c}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd8d0;border-radius:10px;font:inherit;margin:5px 0 10px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#0b3d2e;color:#fff}.green{background:#159447;color:#fff}.red{background:#d83a3a;color:#fff}.gray{background:#e9efeb;color:#102018}.orange{background:#f59e0b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid #dfe8e2;border-radius:14px;padding:12px;background:#fbfdfb}.pic{height:150px;background:#eef3ef;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;color:#738078}.pic img{width:100%;height:100%;object-fit:cover}.profit{font-weight:900;color:#087443}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small{font-size:12px;color:#6b756f}.hidden{display:none!important}table{width:100%;border-collapse:collapse;min-width:900px}td,th{padding:8px;border-bottom:1px solid #edf1ee;text-align:left;vertical-align:top}.scroll{overflow:auto}.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{background:#eef8f1;border-radius:12px;padding:10px 14px}.search{max-width:360px}.danger{color:#b91c1c}.ok{color:#087443}.mutedbox{background:#f7faf8;border:1px dashed #cbd8cf;border-radius:12px;padding:10px;margin:10px 0}.activeTag{color:#087443;font-weight:800}.inactiveTag{color:#b91c1c;font-weight:800}
</style></head><body><header><div class="wrap"><div class="row"><div style="flex:1"><h2 style="margin:0">Milon Online Shop — Admin</h2><div class="small" style="color:#d8eee1">পণ্য, stock, category এবং orders পরিচালনা করুন</div></div><button class="gray" onclick="location.href='/'">🛍️ দোকান দেখুন</button><button class="gray" onclick="logout()">↪ লগআউট</button></div></div></header><div class="wrap">
<div id="login" class="box"><h3>Admin Login</h3><p class="small">এই প্যানেল শুধু আপনার ব্যবহারের জন্য।</p><input id="pw" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()"><button class="primary" onclick="login()">Login</button><p id="msg" class="danger"></p></div>
<div id="app" class="hidden">
<div class="stat"><div>মোট পণ্য: <b id="countProducts">0</b></div><div>Active: <b id="countActive">0</b></div><div>মোট অর্ডার: <b id="countOrders">0</b></div></div>
<div class="box"><div class="row"><h3 style="flex:1">পণ্য যোগ / পরিবর্তন</h3><button class="green" onclick="newProduct()">+ নতুন পণ্য</button><button class="gray" onclick="loadAll()">↻ Refresh</button></div>
<div class="grid"><div><label>পণ্যের নাম *</label><input id="name"></div><div><label>Category</label><select id="category"></select><input id="customCategory" class="hidden" placeholder="নতুন category লিখুন"></div><div><label>বিক্রয়মূল্য ৳</label><input id="price" type="number" min="0"></div><div><label>ক্রয়মূল্য ৳</label><input id="cost" type="number" min="0"></div><div><label>Stock / Quantity</label><input id="stock" type="number" min="0"></div><div><label>Supplier</label><input id="supplier"></div><div><label>Quality Test</label><select id="sampleTest"><option>Pending</option><option>Testing</option><option>Passed</option><option>Failed</option></select></div><div><label>দোকানে দেখাবেন?</label><select id="active"><option value="false">না — Inactive</option><option value="true">হ্যাঁ — Active</option></select></div></div>
<label>বর্ণনা</label><textarea id="desc" placeholder="পণ্যের সংক্ষিপ্ত বর্ণনা"></textarea><label>নোট</label><textarea id="notes"></textarea><label>পণ্যের ছবি</label><input id="imageFile" type="file" accept="image/*" onchange="previewImage()"><div id="preview" class="pic">ছবি নির্বাচন করুন</div><div class="row" style="margin-top:10px"><button class="primary" onclick="saveProduct()">💾 Save / Update</button><button class="red" onclick="deleteProduct()">🗑️ Delete</button></div><p class="profit" id="profit"></p><input id="id" type="hidden"></div>
<div class="box"><div class="row"><h3 style="flex:1">পণ্য তালিকা</h3><input class="search" id="productSearch" placeholder="পণ্য খুঁজুন..." oninput="renderProducts()"></div><div class="mutedbox"><b>Bulk control:</b> <button class="green" onclick="bulkActive(true)">সব Active করুন</button> <button class="gray" onclick="bulkActive(false)">সব Inactive করুন</button> <button class="gray" onclick="loadAll()">↻ Data Refresh</button></div><div id="products" class="grid"></div></div>
<div class="box"><div class="row"><h3 style="flex:1">Customer Orders</h3><button class="gray" onclick="loadOrders()">↻ Orders Refresh</button></div><div class="scroll"><table><thead><tr><th>ID</th><th>Customer</th><th>Items</th><th>Payment</th><th>Status</th><th>Courier</th><th>Tracking</th><th>Save</th></tr></thead><tbody id="orders"></tbody></table></div></div>
</div></div><script>
let products=[],orders=[],editingId='',imageData='';const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('en-BD');
async function api(path,opt={}){const r=await fetch(path,opt);let j={};try{j=await r.json()}catch{}if(r.status===401)throw Error('UNAUTHORIZED');if(!r.ok)throw Error(j.error||'Request failed');return j}
async function login(){const password=$('pw').value;if(!password)return;$('msg').textContent='';try{await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})});showApp();await loadAll()}catch(e){$('msg').textContent=e.message==='UNAUTHORIZED'?'Password ভুল।':'Login failed: '+e.message}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}
async function loadAll(){try{const j=await api('/api/admin/products');products=j.products||[];setCategories(j.categories||[]);renderProducts();await loadOrders();showApp()}catch(e){if(e.message!=='UNAUTHORIZED')alert(e.message)}}
async function loadOrders(){try{const j=await api('/api/admin/orders');orders=j.orders||[];renderOrders(orders);$('countOrders').textContent=orders.length}catch(e){if(e.message!=='UNAUTHORIZED')alert(e.message)}}
function setCategories(cats){const old=$('category').value;const opts=[...new Set([...cats,'স্কিন কেয়ার','গ্রুমিং','পার্সোনাল কেয়ার','কসমেটিকস','হেয়ার কেয়ার','বডি কেয়ার','ঘরের ব্যবহার্য পণ্য','স্মার্ট প্রোডাক্ট','অন্যান্য'])];$('category').innerHTML=opts.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')+'<option value="__custom__">➕ নতুন category...</option>';if(old&&opts.includes(old))$('category').value=old}
$('category').onchange=()=>{$('customCategory').classList.toggle('hidden',$('category').value!=='__custom__')}
function selectedCategory(){return $('category').value==='__custom__'?$('customCategory').value.trim():$('category').value}
function renderProducts(){const q=($('productSearch').value||'').toLowerCase();const list=products.filter(p=>(p.name+' '+p.category+' '+p.supplier).toLowerCase().includes(q));$('countProducts').textContent=products.length;$('countActive').textContent=products.filter(p=>p.active).length;$('products').innerHTML=list.length?list.map(p=>`<div class="card"><div class="pic">${p.image?`<img src="${escAttr(p.image)}" alt="">`:'ছবি নেই'}</div><b>${esc(p.name)}</b><div class="small">${esc(p.category)} · Stock ${p.stock} · ${p.active?'<span class="activeTag">Active</span>':'<span class="inactiveTag">Inactive</span>'}</div><div>বিক্রয়: ৳${money(p.price)} | ক্রয়: ৳${money(p.cost)}</div><div class="profit">লাভ: ৳${money(p.price-p.cost)}</div><div class="small">Quality: ${esc(p.sampleTest)}</div><div class="row" style="margin-top:8px"><button onclick="edit('${escAttr(p.id)}')">Edit</button><button class="green" onclick="toggle('${escAttr(p.id)}')">${p.active?'Hide':'Active'}</button></div></div>`).join(''):'কোনো পণ্য পাওয়া যায়নি।'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
function edit(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;imageData=p.image||'';['name','desc','price','cost','stock','supplier','sampleTest','notes'].forEach(k=>$(k).value=p[k]??'');setCategories([...new Set(products.map(x=>x.category))]);if([...$('category').options].some(o=>o.value===p.category)){$('category').value=p.category;$('customCategory').classList.add('hidden')}else{$('category').value='__custom__';$('customCategory').value=p.category;$('customCategory').classList.remove('hidden')}$('active').value=String(!!p.active);$('id').value=id;$('imageFile').value='';$('preview').innerHTML=p.image?`<img src="${escAttr(p.image)}">`:'ছবি নেই';updateProfit();scrollTo({top:0,behavior:'smooth'})}
function newProduct(){editingId='';imageData='';['name','desc','price','cost','stock','supplier','notes'].forEach(k=>$(k).value='');$('sampleTest').value='Pending';$('active').value='false';$('id').value='';$('imageFile').value='';$('customCategory').value='';$('customCategory').classList.add('hidden');$('category').value='অন্যান্য';$('preview').textContent='ছবি নির্বাচন করুন';updateProfit()}
function previewImage(){const f=$('imageFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),max=900,s=Math.min(1,max/im.width,max/im.height);c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);imageData=c.toDataURL('image/jpeg',.72);$('preview').innerHTML=`<img src="${imageData}">`};im.src=r.result};r.readAsDataURL(f)}
function updateProfit(){$('profit').textContent=`সম্ভাব্য পণ্য লাভ: ৳${money(Number($('price').value||0)-Number($('cost').value||0))}`}$('price').oninput=updateProfit;$('cost').oninput=updateProfit;
async function saveProduct(){try{const category=selectedCategory()||'অন্যান্য';if(category==='__custom__'||!category)return alert('Category দিন');const p={id:$('id').value||undefined,name:$('name').value.trim(),category,desc:$('desc').value,price:Number($('price').value||0),cost:Number($('cost').value||0),stock:Number($('stock').value||0),supplier:$('supplier').value,sampleTest:$('sampleTest').value,active:$('active').value==='true',notes:$('notes').value,image:imageData};if(!p.name)return alert('পণ্যের নাম দিন');if(p.price<=0)return alert('বিক্রয়মূল্য 0-এর বেশি দিন');if(p.stock<=0&&p.active)return alert('Active করতে stock 1 বা তার বেশি দিন');const r=await api('/api/admin/products',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)});alert('পণ্য Save হয়েছে এবং Public page-এর জন্য প্রস্তুত।');await loadAll();edit(r.product.id)}catch(e){alert(e.message)}}
async function deleteProduct(){if(!editingId)return alert('আগে একটি পণ্য select করুন');if(!confirm('এই পণ্যটি Delete করবেন?'))return;try{await api('/api/admin/products/'+encodeURIComponent(editingId),{method:'DELETE'});newProduct();await loadAll()}catch(e){alert(e.message)}}
async function toggle(id){const p=products.find(x=>x.id===id);if(!p)return;try{const copy={...p,active:!p.active};if(copy.active&&(copy.stock<=0||copy.price<=0))return alert('Active করতে price ও stock দিতে হবে।');await api('/api/admin/products',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(copy)});await loadAll()}catch(e){alert(e.message)}}
async function bulkActive(active){if(!confirm(active?'সব পণ্য Active করবেন? যেগুলোর price/stock নেই সেগুলোও public-এ দেখাবে না।':'সব পণ্য Inactive করবেন?'))return;try{await api('/api/admin/products/bulk-active',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({active})});await loadAll()}catch(e){alert(e.message)}}
function renderOrders(list){$('orders').innerHTML=list.length?list.map(o=>`<tr><td>${esc(o.id)}<br><span class="small">${new Date(o.createdAt).toLocaleString('bn-BD')}</span></td><td><b>${esc(o.name)}</b><br>${esc(o.phone)}<br>${esc(o.address)}</td><td>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty} = ৳${money(i.price*i.qty)}`).join('<br>')}</td><td><b>ডেলিভারি: ৳${money(o.delivery)}</b><br><span class="small">bKash advance</span><br>Sender: ${esc(o.senderNumber||'')}<br>TrxID: ${esc(o.trxid||'')}<br><b>COD: ৳${money(o.codAmount??o.subtotal)}</b><br>Total: ৳${money(o.total)}</td><td><select id="s_${escAttr(o.id)}"><option ${o.status==='নতুন'?'selected':''}>নতুন</option><option ${o.status==='কনফার্ম'?'selected':''}>কনফার্ম</option><option ${o.status==='কুরিয়ারে'?'selected':''}>কুরিয়ারে</option><option ${o.status==='ডেলিভার্ড'?'selected':''}>ডেলিভার্ড</option><option ${o.status==='বাতিল'?'selected':''}>বাতিল</option></select></td><td><input id="c_${escAttr(o.id)}" value="${escAttr(o.courier||'')}" placeholder="যেমন: Pathao"></td><td><input id="t_${escAttr(o.id)}" value="${escAttr(o.tracking||'')}" placeholder="Tracking"></td><td><button onclick="saveOrder('${escAttr(o.id)}')">Save</button></td></tr>`).join(''):'এখনো কোনো online order নেই।'}
async function saveOrder(id){try{await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({status:$('s_'+id).value,courier:$('c_'+id).value,tracking:$('t_'+id).value})});alert('Order update হয়েছে');await loadOrders()}catch(e){alert(e.message)}}
(async()=>{try{const j=await api('/api/admin/products');products=j.products||[];setCategories(j.categories||[]);showApp();renderProducts();await loadOrders()}catch(e){}})();
</script></body></html>
